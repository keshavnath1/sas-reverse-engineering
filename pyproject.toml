[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sas-reverse-engineering"
version = "0.1.0"
description = "P0 foundation for an evidence-driven SAS architecture planner"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
sas-re = "sas_re.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sas_re = ["data/*.json"]
