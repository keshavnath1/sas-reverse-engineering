[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sas-reverse-engineering"
version = "0.2.0"
description = "P1 canonical source evidence foundation for a SAS architecture planner"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["jsonschema==4.26.0"]

[project.scripts]
sas-re = "sas_re.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sas_re = ["data/*.json", "contracts/v1/*.json"]
