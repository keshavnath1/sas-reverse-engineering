name: P0 and P1 validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.5'
      - name: Install hash-locked dependencies and packaging tools
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
      - name: Install P1 package
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Check tracked files and P0/P1 behavior
        run: |
          python -m pip check
          python scripts/check_repository.py
          python -m unittest discover -s tests -v
          python scripts/p1_demo.py --destination "$RUNNER_TEMP/synthetic-p1"
      - name: Build and install distributable
        run: |
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir dist .
          python -m pip install --no-deps --force-reinstall dist/*.whl
          cd "$RUNNER_TEMP"
          python -c 'import sas_re; assert "site-packages" in sas_re.__file__, sas_re.__file__'
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
          sas-re status
          python -m sas_re --version

  downstream-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.5'
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
      - run: python -m pip install --no-deps --no-build-isolation .
      - name: Check public branch against frozen baseline
        run: sas-re check-baseline --remote
